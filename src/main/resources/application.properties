spring.datasource.url=jdbc:postgresql://localhost:5050/auth
spring.datasource.username=postgres
spring.datasource.password=auth-password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
api.security.token.secret=${JWT_TOKEN:your-secret-token-application}